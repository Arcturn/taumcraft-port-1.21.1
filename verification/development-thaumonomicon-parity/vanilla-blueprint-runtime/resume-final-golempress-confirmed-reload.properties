screen.layoutKey=LayoutKey[text\=Я изобрёл специальный пресс, который позволяет создавать простых големов. Он состоит из наковальни и кузницы, которые упрощают сборку деталей.<LINE>Для того, чтобы собрать голема, мне достаточно зайти в интерфейс Пресса Големов и выбрать компоненты, с которых голем будет собран. На данный момент, разнообразие компонентов ограничено, но я уверен, что со временем смогу изобрести их в большем количестве.<PAGE>На самом деле, создание голема достаточно простой процесс\: Каждый голем может состоять из 5 или менее компонентов\: Базового материала, типа головы, рук, ног и дополнительного опционального модуля. Нужно просто выбрать необходимые опции и справа отобразится список требуемых материалов для создания голема. Как можно догадаться, в инвентаре игрока необходимо иметь все перечисленные компоненты для того, чтобы можно было начать процесс создания.<BR>В списке, расположенном посредине, отображены черты, сердца, броня и урон, которыми голем будет обладать.<BR>И наконец, в пресс нужно поставлять аспект Machina. Для этого предназначены несколько портов, расположенных ниже основного механизма пресса.<PAGE>Теперь полученного голема можно разместить там, где Вы пожелаете, однако это не даст особого результата, пока в него не будет установлена §5Контрольная Печать Голема§0. Больше информации о ней можно почерпнуть из категории исследований, где она будет разблокирована.<BR>Если у голема отсутствуют задачи для выполнения, то он вернётся в точку, где изначально был размещён. Голема можно подобрать с помощью щелчка правой кнопки мыши по нему во время подкрадывания.<BR>Также есть возможность назначить голему определённый цвет, кликнув по нему, держа в руках нужный краситель. Это полезно для накладывания ограничений на некоторые печати. Подбор голема очищает его от назначенного цвета., height\=182, lineHeight\=9, resourceEpoch\=2, language\=ru_ru, uniform\=false]
