screen.layoutKey=LayoutKey[text\=Для того, чтобы начать наполнение, мне понадобится несколько вещей\: Руническая Матрица (которая у меня уже имеется), мистические пьедесталы и готовый запас магии в виде эссенций.<BR>После правильного размещения Рунической Матрицы в структуре, более известной, как Алтарь Наполнения, можно начинать сам процесс. Алтарь активируется с помощью Salis Mundus, как и большинство мистических структур. После размещения колонн, Руническую Матрицу можно активировать с помощью перчатки заклинателя.<BR>Центральный пьедестал, расположенный под матрицей, является местом, где нужно разместить объект для наполнения. Вам также нужно еще несколько пьедесталов, размещенных вокруг центрального, на которые будут выкладываться предметы и блоки, которыми будет наполнен целевой объект. И наконец - Вам понадобятся банки или схожие контейнеры с требуемым для наполнения количеством Вис.<BR>После выполнения всех вышеперечисленных условий, процесс наполнения можно начать, щелкнув по Рунической Матрице перчаткой заклинателя.<BR>Во время первого этапа наполнения, эссенция извлекается из её ближайших источников. Если в доступном радиусе не обнаружится достаточное количество эссенции, то наполнение застопорится и уж поверьте - это не то, чего бы Вам хотелось и причины этого будут раскрыты на следующих страницах.<BR>После наполнения целевого объекта всей необходимой эссенцией, окружающие объекты также начнут расщепляться на эссенции их сущности. И только после завершения этого процесса, наполнение можно считать успешным.<LINE>Процесс наполнения связан с некоторыми рисками. Вся суть процесса состоит в том, чтобы в принудительном порядке направить огромные потоки энергии в один единственный объект. И, зачастую, это провоцирует самые непредсказуемые вещи.<BR>Обычно, какой-то из объектов для наполнения может быть сброшен с пьедестала, или же в процессе могут образоваться Выбросы, однако известны случаи и более катастрофических последствий.<BR>Если вовремя не решать проблемы, возникающие во время процесса наполнения, то вероятность какого-то плохого последствия в дальнейшем значительно возрастает.<BR>В целом, с помощью различных способов, вероятность подобных проблем можно уменьшить. Во первых, вам необходимо, чтобы вся структура была максимально симметричной; обращайте внимание на то, где вы располагаете пьедесталы и расположены ли они таким же образом на зеркальной стороне алтаря. Также старайтесь размещать и предметы на пьедесталах. И, в конечном итоге, на стабильность процесса влияет оккультная атрибутика, расположенная вокруг алтаря (вроде свечей, черепов и т.п.), их также нужно размещать максимально симметрично.<IMG>thaumcraft\:textures/research/research5.png\:128\:0\:128\:136\:1</IMG>, height\=182, lineHeight\=9, resourceEpoch\=1, language\=ru_ru, uniform\=false]
