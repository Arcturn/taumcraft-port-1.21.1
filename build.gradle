plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'thaumcraft'
version = mod_version
base { archivesName = 'thaumcraft-renaissance-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.theillusivec4.top/' }
}

neoForge {
    // ModDev reads src/main/resources/META-INF/accesstransformer.cfg automatically.
    validateAccessTransformers = true
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        data {
            data()
            programArguments.addAll '--mod', 'thaumcraft', '--all', '--output', file('build/worldgen-checks').getAbsolutePath(), '--existing', file('src/main/resources').getAbsolutePath()
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'thaumcraft'
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods {
        thaumcraft { sourceSet(sourceSets.main) }
    }
}

dependencies {
    implementation "com.github.glitchfiend:TerraBlender-neoforge:${terrablender_version}"
    jarJar("com.github.glitchfiend:TerraBlender-neoforge:${terrablender_version}") {
        version { strictly '[1.21.1-4.1.0.8,1.21.1-4.2)'; prefer project.terrablender_version }
    }
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test', Test) { useJUnitPlatform() }
// Plain JUnit codec tests need the same real Minecraft/NeoForge API as main.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
tasks.named('processResources', ProcessResources) {
    exclude 'META-INF/jarjar/**' // Generated by jarJar in a Gradle build; manual packager uses checked-in metadata.
    inputs.property('version', project.version)
    // The template expander intermittently produced an empty TOML in the work environment.
    // Substitute the one supported token directly and verify the generated metadata.
    doLast {
        def source = file('src/main/resources/META-INF/neoforge.mods.toml').getText('UTF-8')
        def expected = source.replace('${version}', project.version.toString())
        def target = destinationDir.toPath().resolve('META-INF/neoforge.mods.toml')
        java.nio.file.Files.writeString(target, expected, java.nio.charset.StandardCharsets.UTF_8)
        if (java.nio.file.Files.readString(target, java.nio.charset.StandardCharsets.UTF_8) != expected) {
            throw new GradleException('Generated mod metadata does not match the source template')
        }
    }
}

// Generate a source JAR alongside the runnable mod.
java { withSourcesJar() }
